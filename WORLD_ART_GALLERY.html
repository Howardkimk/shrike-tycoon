<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/fonts/jua.css"><style>*{box-sizing:border-box}body{background:#e4e9cd;color:#332e24;font-family:Jua,sans-serif;margin:0;padding:28px}h1{margin:0;color:#566e42}p{margin:8px 0 20px}main{max-width:1440px;margin:auto}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}article{border-radius:24px;background:#fff3d8;border:1px solid #c5b18b;padding:10px;text-align:center;box-shadow:0 4px #566e4222}img{width:100%;height:130px;object-fit:contain;image-rendering:pixelated}b{display:block;font-size:13px}small{display:block;font-size:11px;color:#655e4e}i{display:block;font-size:10px}label{display:inline-block;margin:12px 8px 12px 0;padding:10px 20px;background:#566e42;color:#fff3d8;border-radius:20px;cursor:pointer}.new{color:#566e42;margin-top:4px}.pending{padding:16px;border-radius:24px;background:#fff3d8;margin-top:20px}button{border:0;padding:10px 20px;background:#566e42;color:#fff3d8;border-radius:20px;font-family:inherit}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}body{padding:16px}}@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><title>때까치 타이쿤 · 월드 풍경</title><style>.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}img{height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:16px}b{font-size:20px;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><main><h1>세계의 때까치 식당</h1><p>기존 WORLD 1 + 새 풍경 WORLD 2–10 · 0.8.4.6</p><div class="grid"><article><img src="assets/pixel/world1.png" alt="농경지의 아침"><b>WORLD 1 · 농경지의 아침</b></article><article><img src="assets/pixel/world2.png" alt="강을 따라서"><b>WORLD 2 · 강을 따라서</b></article><article><img src="assets/pixel/world3.png" alt="산과 밤"><b>WORLD 3 · 산과 밤</b></article><article><img src="assets/pixel/world4.png" alt="히말라야"><b>WORLD 4 · 히말라
