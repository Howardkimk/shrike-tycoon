<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="styles.css"></head><body class="in-game"><main class="app-shell"><section id="gameScreen" class="game-screen"><div class="panel hud">HUD</div><div class="panel burn-strip">BURN</div><div class="panel orders-panel">ORDERS</div><div class="work-area">WORK</div><div class="panel status-panel">STATUS</div><div class="game-actions"><button class="ghost-button">⏸ 일시정지</button><button class="ghost-button">← 월드맵으로 나가기</button></div></section></main><output id="test"></output><script>setTimeout(()=>{const a=document.querySelector('.game-actions'),r=a.getBoundingClientRect();document.querySelector('#test').textContent=JSON.stringify({w:innerWidth,h:innerHeight,coarse:matchMedia('(pointer:coarse)').matches,land:matchMedia('(orientation:landscape)').matches,pos:getComputedStyle(a).position,bottom:getComputedStyle(a).bottom,top:r.top,b:r.bottom,visible:r.top>=0&&r.bottom<=innerHeight});},100);</script></body></html>
